<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';
 style-src 'unsafe-inline';
 script-src 'unsafe-inline';
 img-src data:;
 connect-src 'none';
 form-action 'none';
 base-uri 'none'">
<title>Contract amendment review</title><style>
:root{color-scheme:light;
--ink:#1c332c;
--muted:#50635b;
--green:#245d46;
--line:#cfdbd3;
--paper:#fff;
--wash:#f3f6f2;
--warning:#704324}

*{box-sizing:border-box}
body{margin:0;
background:var(--wash);
color:var(--ink);
font:16px/1.6 system-ui,sans-serif}

header,main{max-width:1120px;
margin:auto;
padding:32px}
header{padding-top:44px}
h1{font:normal clamp(30px,4vw,44px)/1.15 Georgia,serif;
margin:0 0 12px}
h2{font-size:23px;
margin:0 0 16px}
h3{font-size:18px;
margin:0 0 8px}
h4{font-size:14px;
margin:0 0 8px;
color:var(--muted)}
p{max-width:75ch;
margin:8px 0 16px}
.title{font-size:19px}
.notice{padding:14px 18px;
background:#e4eee5;
color:#244732;
border-radius:8px}
section{margin:0 0 44px}
article{background:var(--paper);
padding:24px 0;
margin:0;
border-top:1px solid var(--line)}
section:has(article){background:var(--paper);
padding:24px;
border-radius:12px}

.compare{display:grid;
grid-template-columns:minmax(0,1fr) minmax(0,1fr);
gap:24px;
margin:20px 0}
.compare>div{min-width:0}
.date{font-variant-numeric:tabular-nums;
font-size:18px}
pre{white-space:pre-wrap;
overflow-wrap:anywhere;
font:13px/1.55 ui-monospace,monospace;
background:var(--wash);
padding:16px;
margin:0}
figure{margin:20px 0}
blockquote{margin:0 0 8px;
font:18px/1.6 Georgia,serif;
max-width:70ch}
figcaption{color:var(--muted);
font-size:13px}
label{display:block;
margin:18px 0 10px;
font-weight:600}
input:not([type=checkbox]),textarea{display:block;
width:100%;
max-width:700px;
padding:12px;
font:inherit;
color:var(--ink);
background:white;
border:1px solid #81988a;
border-radius:6px;
margin-top:6px;
caret-color:var(--green)}
select{font:inherit;
padding:8px;
margin-left:12px;
color:var(--ink);
background:white;
border:1px solid #81988a;
border-radius:6px}
.check{font-weight:400;
display:flex;
gap:10px;
align-items:start}
.check input{margin-top:7px;
accent-color:var(--green);
width:18px;
height:18px;
flex-shrink:0}
details{border-top:1px solid var(--line);
padding:14px 0}
summary{cursor:pointer;
color:var(--green);
font-weight:600}
details pre{margin-top:12px}
button{background:var(--green);
color:white;
border:1px solid var(--green);
border-radius:6px;
padding:12px 18px;
font:600 15px system-ui;
cursor:pointer}
button:hover{background:#193f31}
button.secondary{background:white;
color:var(--green)}
button.secondary:hover{background:#e4eee5}
button:disabled{opacity:.5;
cursor:not-allowed}
.actions{display:flex;
flex-wrap:wrap;
gap:12px;
margin:20px 0}
a{color:var(--green);
text-underline-offset:3px}
:focus-visible{outline:3px solid #96722c;
outline-offset:3px}
::selection{background:#cbe3ca}
.blocked{color:var(--warning);
background:#fcf2e8;
padding:24px;
border-radius:12px}
code{overflow-wrap:anywhere}
.decision{padding-top:20px}
#status{color:var(--muted)}

@media(max-width:650px){header,main{padding:22px}
header{padding-top:30px}
.compare{grid-template-columns:1fr;
gap:16px}
section:has(article){padding:18px}
select{display:block;
margin:8px 0 0}
pre{font-size:12px}
}

@media print{body{background:white}
button,form{display:none}
details{break-inside:avoid}
header,main{max-width:none;
padding:12px}
article{break-inside:avoid}
}

</style></head><body>
